<main class="auth-page">
  <section class="auth-card auth-card-register" aria-labelledby="register-title">
    <div class="auth-brand-mark" aria-hidden="true">
      <svg lucideShieldCheck [size]="22"></svg>
    </div>
    <div class="auth-heading">
      <span class="auth-eyebrow">Pistolet</span>
      <h1 id="register-title">Crea tu cuenta</h1>
      <p>Únete a una comunidad que disfruta lo recién horneado.</p>
    </div>

    <form class="auth-form" (ngSubmit)="registrar()" #registerForm="ngForm">
      <div *ngIf="mensajeError" class="auth-alert" role="alert">
        {{ mensajeError }}
      </div>

      <div class="auth-field">
        <label for="register-name">Nombre completo</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" lucideUserRound [size]="18" aria-hidden="true"></svg>
          <input id="register-name" type="text" name="nombre" [(ngModel)]="usuario.nombre" placeholder="Tu nombre" autocomplete="name" required>
        </div>
      </div>

      <div class="auth-field">
        <label for="register-email">Correo electrónico</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" lucideMail [size]="18" aria-hidden="true"></svg>
          <input id="register-email" type="email" name="email" [(ngModel)]="usuario.email" placeholder="ejemplo@correo.com" autocomplete="email" required>
        </div>
      </div>

      <div class="auth-field">
        <label for="register-password">Contraseña</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" lucideLockKeyhole [size]="18" aria-hidden="true"></svg>
          <input id="register-password" type="password" name="password" [(ngModel)]="usuario.password" placeholder="Crea una contraseña segura" autocomplete="new-password" minlength="8" required>
        </div>
        <span class="auth-help">Usa al menos 8 caracteres.</span>
      </div>

      <button class="auth-submit" type="submit" [disabled]="registerForm.invalid">
        Registrarme
        <svg lucideArrowRight [size]="18" aria-hidden="true"></svg>
      </button>
    </form>

    <div class="auth-divider"><span>¿Ya tienes una cuenta?</span></div>
    <a routerLink="/login" class="auth-secondary-action">Iniciar sesión</a>
  </section>
</main>
