<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <div class="auth-brand-mark" aria-hidden="true">
      <svg lucideShieldCheck [size]="22"></svg>
    </div>
    <div class="auth-heading">
      <span class="auth-eyebrow">Pistolet</span>
      <h1 id="login-title">Bienvenido de vuelta</h1>
      <p>Accede para continuar con tu experiencia.</p>
    </div>

    <form class="auth-form" (ngSubmit)="entrar()" #loginForm="ngForm">
      <div *ngIf="mensajeError" class="auth-alert" role="alert">
        {{ mensajeError }}
      </div>

      <div class="auth-field">
        <label for="login-email">Correo electrónico</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" lucideMail [size]="18" aria-hidden="true"></svg>
          <input id="login-email" type="email" name="email" [(ngModel)]="credenciales.email" placeholder="ejemplo@correo.com" autocomplete="email" required>
        </div>
      </div>

      <div class="auth-field">
        <label for="login-password">Contraseña</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" lucideLockKeyhole [size]="18" aria-hidden="true"></svg>
          <input id="login-password" type="password" name="password" [(ngModel)]="credenciales.password" placeholder="Tu contraseña" autocomplete="current-password" required>
        </div>
      </div>

      <button class="auth-submit" type="submit" [disabled]="loginForm.invalid">
        Entrar
        <svg lucideArrowRight [size]="18" aria-hidden="true"></svg>
      </button>
    </form>

    <div class="auth-divider"><span>¿Primera vez aquí?</span></div>
    <a routerLink="/register" class="auth-secondary-action">Crear una cuenta</a>
  </section>
</main>
