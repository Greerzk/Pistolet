<header id="home" class="mt-0">
  <div class="position-relative">
    <img src="img/landing_pistolet.jpg" class="img-fluid w-100 banner-full" alt="Banner Pistolet">
    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center bg-dark bg-opacity-50 text-center">
      <h1 class="display-4 text-white fw-bold">Panadería Pistolet</h1>
      <p class="lead text-white fs-4">Desde 1997 endulzando tus momentos más especiales</p>
      <a routerLink="/home" class="btn btn-primary btn-lg rounded-pill px-5">Explorar</a>
    </div>
  </div>
</header>

<section id="destacados" class="py-5">
  <div class="container-fluid px-0"> 
    <div class="text-center mb-5">
      <h2 class="fw-bold display-5">Sabor que nos distingue</h2>
      <div style="width: 80px; height: 3px; background: var(--color-cobre); margin: 0 auto;"></div>
    </div>

    <div class="d-flex flex-row flex-nowrap overflow-auto pb-4 custom-scrollbar">
      <div class="card flex-shrink-0 ms-3 me-3 shadow-sm rounded-4 border-0" style="min-width: 18rem;">
        <div class="ratio ratio-4x3">
          <img src="img/Productos/pan/Conchas_1.jpg" class="object-fit-cover rounded-top-4" alt="Concha">
        </div>
        <div class="card-body text-center bg-white rounded-bottom-4">
          <h5 class="card-title fw-bold">Concha</h5>
        </div>
      </div>
      <div class="card flex-shrink-0 me-3 shadow-sm rounded-4 border-0" style="min-width: 18rem;">
        <div class="ratio ratio-4x3">
          <img src="img/Productos/pan/Cuernitos_1.jpg" class="object-fit-cover rounded-top-4" alt="Cuernito">
        </div>
        <div class="card-body text-center bg-white rounded-bottom-4">
          <h5 class="card-title fw-bold">Cuernito</h5>
        </div>
      </div>
      <div class="card flex-shrink-0 me-3 shadow-sm rounded-4 border-0" style="min-width: 18rem;">
        <div class="ratio ratio-4x3">
          <img src="img/Productos/pan/Donas_1.jpg" class="object-fit-cover rounded-top-4" alt="Dona">
        </div>
        <div class="card-body text-center bg-white rounded-bottom-4">
          <h5 class="card-title fw-bold">Dona</h5>
        </div>
      </div>
      <div class="card flex-shrink-0 me-3 shadow-sm rounded-4 border-0" style="min-width: 18rem;">
        <div class="ratio ratio-4x3">
          <img src="img/Productos/pan/Piedra_1.png" class="object-fit-cover rounded-top-4" alt="Bollo">
        </div>
        <div class="card-body text-center bg-white rounded-bottom-4">
          <h5 class="card-title fw-bold">Bollo</h5>
        </div>
      </div>
      <div class="card flex-shrink-0 me-3 shadow-sm rounded-4 border-0" style="min-width: 18rem;">
        <div class="ratio ratio-4x3">
          <img src="img/Productos/pan/Empanada_1.png" class="object-fit-cover rounded-top-4" alt="Empanada">
        </div>
        <div class="card-body text-center bg-white rounded-bottom-4">
          <h5 class="card-title fw-bold">Empanada</h5>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="py-5 bg-white text-center shadow-sm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="fw-bold mb-3">¡Conéctate con Pistolet!</h2>
        <p class="text-muted mb-4">Escanea el código para seguirnos en Facebook y no perderte ninguna promoción.</p>
        
        <div class="d-inline-block p-4 bg-light rounded-4 border border-2" style="border-color: var(--ps-border) !important;">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://www.facebook.com/share/18LX8pKjXB/&color=5D4037&bgcolor=f8f9fa" 
               alt="QR Facebook Pistolet" 
               class="img-fluid rounded-2"
               style="max-width: 200px;">
        </div>
        
        <div class="mt-3">
          <span class="badge rounded-pill px-3 py-2 text-white" style="background-color: var(--ps-copper);">
            <i class="bi bi-facebook me-1"></i> @PistoletPanaderia
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
