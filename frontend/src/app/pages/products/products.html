<header class="mb-4 mt-5 pt-4">
  <div class="container text-center mb-5">
    <h2 class="fw-bold display-5">Nuestro Catálogo</h2>
    <div class="mx-auto mb-4" style="width: 80px; height: 3px; background: var(--color-cobre);"></div>
    
    <form class="d-flex justify-content-center" role="search" onsubmit="return false;">
      <input id="buscador-publico" type="search" class="form-control rounded-pill w-75 shadow-sm p-3" placeholder="Buscar productos..." aria-label="Buscar">
    </form>
  </div>

  <div class="container-fluid px-3 px-md-5">
    <div id="bannerCarousel" class="carousel slide shadow-sm rounded-5 overflow-hidden" data-bs-ride="carousel">
      <div class="carousel-inner" style="height: 400px;">
        <div class="carousel-item active h-100">
          <img src="img/Banner_Pan.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Panadería">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-75 text-white rounded-4 px-4 py-3" style="max-width: 600px; margin: 0 auto;">
            <h1 class="h2 fw-bold text-white">Nuestros Panes</h1>
            <p class="mb-0 fs-5">Tradición y sabor en cada mordida</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="py-5 bg-light">
  <div class="container">
    <div class="row g-4 text-center">
      <div class="col-md-4">
        <div class="card border-0 h-100 shadow-sm rounded-4">
          <div class="card-body p-4">
            <h5 class="fw-bold text-dark fs-4">Panadería</h5>
            <p class="text-success fw-semibold m-0">Disponible</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 h-100 shadow-sm rounded-4">
          <div class="card-body p-4">
            <h5 class="fw-bold text-secondary fs-4">Pasteles</h5>
            <p class="text-muted m-0">Próximamente</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 h-100 shadow-sm rounded-4">
          <div class="card-body p-4">
            <h5 class="fw-bold text-secondary fs-4">Especial del mes</h5>
            <p class="text-muted m-0">Próximamente</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="py-5">
  <div class="container">
    <div class="row g-4">
      
      <div *ngIf="cargando" class="text-center py-5 w-100">
          <div class="spinner-border text-primary" role="status" style="color: var(--color-cobre) !important;">
              <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-3 fs-5">Horneando el catálogo...</p>
      </div>

      <ng-container *ngIf="!cargando && catalogo.length > 0">
        <div *ngFor="let pan of catalogo" class="col-md-4 col-lg-3">
          <div class="card h-100 shadow-sm rounded-4 border-0">
            <img [src]="pan.imagen" (error)="onImagenError($event)" class="card-img-top rounded-top-4" alt="{{ pan.nombre }}" style="height: 200px; object-fit: cover;">
            <div class="card-body d-flex flex-column text-center">
              <h5 class="card-title fw-bold">{{ pan.nombre }}</h5>
              <p class="card-text fw-bold fs-5" style="color: var(--color-cobre);">${{ pan.precio.toFixed(2) }}</p>
              <a [routerLink]="['/producto', pan.id]" class="btn btn-dark mt-auto rounded-pill">Ver detalle</a>
            </div>
          </div>
        </div>
      </ng-container>

      <div *ngIf="!cargando && catalogo.length === 0" class="text-center py-5 w-100">
        <p class="fs-5 text-muted">Aún no hay panes saliendo del horno.</p>
      </div>

    </div>
  </div>
</section>
